<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DMT Daily Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an operations console. Slim top bar with identity and role, tab rail, then a working area of panels. Numbers in mono, labels in small caps. */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --surface-2:#eaf0f0; --ink:#142328; --muted:#56686f; --line:#d4dfe0;
  --accent:#0b6b66; --accent-ink:#ffffff; --accent-soft:#d9eeec;
  --warn:#9a5800; --warn-soft:#fbeed6; --good:#1c7638; --good-soft:#e0f2e4; --bad:#b3261e;
  --s1:#0f7d77; --s2:#2f5db0; --s3:#c98412; --s4:#7e5fb8; --s5:#b0476f; --s6:#5d7a2a; --s0:#b9c6c8;
  --display:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1517; --surface:#142023; --surface-2:#1a292d; --ink:#e2ebec; --muted:#93a6ab; --line:#29393d;
  --accent:#43c2b8; --accent-ink:#062220; --accent-soft:#143633;
  --warn:#eaae4e; --warn-soft:#3a2c13; --good:#6fd08a; --good-soft:#163222; --bad:#ff8a80;
  --s1:#43c2b8; --s2:#7ea6f0; --s3:#e8ad4c; --s4:#b59ce8; --s5:#e889ad; --s6:#a6c768; --s0:#3d5054;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1517; --surface:#142023; --surface-2:#1a292d; --ink:#e2ebec; --muted:#93a6ab; --line:#29393d;
  --accent:#43c2b8; --accent-ink:#062220; --accent-soft:#143633;
  --warn:#eaae4e; --warn-soft:#3a2c13; --good:#6fd08a; --good-soft:#163222; --bad:#ff8a80;
  --s1:#43c2b8; --s2:#7ea6f0; --s3:#e8ad4c; --s4:#b59ce8; --s5:#e889ad; --s6:#a6c768; --s0:#3d5054;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);padding-inline:16px;padding-block:0 48px}
.app{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700}
h3{font-size:14px;font-weight:700}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:18px 14px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:22px;font-weight:800}
.brand .today{color:var(--muted);font-size:13px}
.who{display:flex;align-items:center;gap:10px}
.who img{width:30px;height:30px;border-radius:50%}
.who .nm{font-weight:600;line-height:1.2}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.plain{background:var(--surface-2);color:var(--muted)}
.viewas{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
select,input[type=text],input[type=date],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
textarea{width:100%;resize:vertical;min-height:64px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-size:13px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}

/* layout */
.bar{display:flex;flex-wrap:wrap;align-items:end;gap:12px 16px;margin-bottom:16px}
.bar .grow{margin-right:auto}
.field{display:flex;flex-direction:column;gap:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid2,.grid2e{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel+.panel{margin-top:16px}
.panel-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:16px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 10px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* counters */
.ctr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 18px}
.ctr{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line)}
.ctr .nm{flex:1;min-width:0;font-size:13px;overflow-wrap:anywhere}
.ctr.has .nm{font-weight:600}
.ctr button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:16px;line-height:1;flex:none}
.ctr button:hover{border-color:var(--accent);color:var(--accent)}
.ctr input{width:56px;text-align:center;font-family:var(--mono);padding:5px 4px;flex:none}
.ctr.big{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2)}
.ctr.big .nm{font-weight:600;font-size:13px;letter-spacing:.04em}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.totalbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:12px 14px;border-radius:8px;background:var(--surface-2);margin-top:14px}
.totalbar .big{font-family:var(--mono);font-size:26px;font-weight:500}
.status{font-size:12px;color:var(--muted);margin-left:auto}
.status.err{color:var(--bad)}
.section-gap{margin-top:18px}

/* lists */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.row .v{font-family:var(--mono);font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
.hbar{flex:1.4;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:40px}
.hbar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.mix{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);flex:1.4;min-width:40px}
.mix>i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi .v{font-family:var(--mono);font-size:28px;font-weight:500;line-height:1.2;margin-top:4px;overflow-wrap:anywhere}
.kpi .v.txt{font-family:var(--display);font-size:20px;font-weight:700}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.up{color:var(--good)} .down{color:var(--bad)}

/* chart */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:520px;height:auto}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .rest{fill:var(--s0)}

/* table */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

/* report */
pre.report{font-family:var(--mono);font-size:12.5px;line-height:1.55;background:var(--surface-2);border-radius:8px;padding:14px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:560px;overflow:auto}
.issue{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.issue .label b{color:var(--ink)}
.note{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--surface-2);margin-bottom:6px}
.note b{font-weight:600}

/* issue notes */
.notes{display:flex;flex-direction:column}
.nitem{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.nitem:last-of-type{border-bottom:0}
.nitem .tx{flex:1 1 220px;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
.nitem .meta{font-size:12px;color:var(--muted);flex-basis:100%}
.nitem .acts{display:flex;gap:6px;margin-left:auto}
.nedit{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--accent);border-radius:8px;background:var(--surface-2);margin:8px 0}
.nedit .acts{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font-weight:600;font-size:12px}
.range{display:flex;flex-wrap:wrap;align-items:end;gap:8px 12px}
.range input[type=date]{padding:5px 8px}
.filters{display:flex;flex-wrap:wrap;align-items:end;gap:12px 16px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.filters .sep{width:1px;align-self:stretch;background:var(--line)}
@media (max-width:640px){.filters .sep{display:none}}
.who-banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:12px}
.who-banner .big{font-family:var(--display);font-size:22px;font-weight:800}

/* campaigns */
.pill.info{background:var(--surface-2);color:var(--s2)}
.pill.bad{background:var(--surface-2);color:var(--bad)}
.cstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.cstat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;text-align:left;cursor:pointer;min-width:0}
.cstat .v{font-family:var(--mono);font-size:24px;line-height:1.2}
.cstat[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.clist{display:flex;flex-direction:column;gap:10px}
.camp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.camp.open{border-color:var(--accent)}
.camp-top{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 16px}
.camp-name{flex:1 1 260px;min-width:0}
.camp-name h3{font-size:16px;overflow-wrap:anywhere}
.camp-name .sub{font-size:12px;color:var(--muted);margin-top:2px}
.camp-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.validity{flex:0 1 260px;min-width:180px}
.validity .track{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.validity .track i{display:block;height:100%;background:var(--accent)}
.validity .track i.warn{background:var(--warn)}
.validity .dates{font-family:var(--mono);font-size:12px}
.validity .left{font-size:12px;color:var(--muted)}
.camp-detail{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.camp-detail{grid-template-columns:minmax(0,1fr)}}
.dl{display:grid;grid-template-columns:minmax(110px,max-content) minmax(0,1fr);gap:8px 14px;font-size:13.5px;margin:0}
.dl dt{color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;padding-top:2px}
.dl dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:13px}
.file .fn{flex:1 1 140px;min-width:0;overflow-wrap:anywhere;font-weight:500}
.file .fs{font-family:var(--mono);font-size:11px;color:var(--muted)}
.camp-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form .full{grid-column:1/-1}
@media (max-width:640px){.form{grid-template-columns:minmax(0,1fr)}}
.form input[type=text],.form input[type=url],.form select,.form input[type=date]{width:100%}
input[type=url],input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;background:var(--surface)}
.check:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.check input{accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;font-size:13px;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.modal{position:fixed;inset:0;background:rgba(10,20,22,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal-box{background:var(--surface);border-radius:var(--r);width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.modal-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.modal-h .t{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.modal-b{flex:1;min-height:0;overflow:auto;background:var(--surface-2)}
.modal-b iframe{display:block;width:100%;height:75vh;border:0;background:#fff}
.modal-b img{display:block;margin:0 auto;max-height:78vh}
.mini-camp{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.mini-camp:last-child{border-bottom:0}
.mini-camp button{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;color:inherit;cursor:pointer;overflow-wrap:anywhere}
.mini-camp button:hover{color:var(--accent)}

/* onboarding */
.welcome{max-width:560px;margin:40px auto;text-align:left}
.welcome h2{font-size:26px;margin-bottom:6px}
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:18px}
.namegrid .btn{padding:12px;text-align:left}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:10;max-width:calc(100% - 32px)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.hbar>i,.mix>i{transition:width .3s ease}}
[hidden]{display:none!important}
img{max-width:100%}
input[type=email]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.welcome .btn.primary{font-size:15px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>DMT Daily Tracker</h1><span class="today" id="today"></span></div>
    <div class="viewas" id="viewas-wrap" hidden><label for="viewas">View as</label><select id="viewas"></select></div>
    <div class="who" id="who"></div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="main"><div class="loading">Loading the team’s cases…</div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const TOPICS_DEFAULT=["DEALERSHIP","INCENTIVE","MNP ISSUE","INFO","USER ISSUE (forward to CS team)","OWNERSHIP","REGISTER ISSUE","ERECHARGE","KPI","VIP NUMBER","CP58","E-INVOICE","BLACK","AFFILIATE","HIERARCHY","DREG","FRAUD","LOGIN/ ONESYS","SRP","Esim","ONEXAPP"];
const CH_DEFAULT=["CALL","EMAIL","WHATSAPP","WALK-IN"];
const ROLES={staff:"Support staff",supervisor:"Supervisor",manager:"Manager"};
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON3=MONTHS.map(m=>m.slice(0,3));

const S={db:null,user:null,uid:null,isOwner:false,canEdit:false,meName:"",meAvatar:"",live:false,ready:false,
  config:normConfig(null),members:{},entries:{},summaries:{},byDate:{},
  tab:null,viewAs:"",logDate:todayISO(),logStaff:null,teamDate:todayISO(),
  range:"30",from:null,to:null,dashStaff:"",
  form:null,formId:null,dirty:false,saveTimer:null,confirmRemove:null,
  noteEdit:null,noteDel:null,allMembers:[],memberNames:{},meKey:null,meEmail:"",
  campaigns:{},campEdit:null,campOpen:null,campDel:null,campF:{status:"active",q:"",aud:"",sort:"end"},assets:null,downloads:null};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
function put(el,...k){el.replaceChildren(...k.flat(Infinity).filter(x=>x!=null&&x!==false))}
function h(tag,p,...kids){const el=document.createElement(tag);for(const[k,v]of Object.entries(p||{})){if(v==null||v===false)continue;if(k==="class")el.className=v;else if(k==="text")el.textContent=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);else if(k==="value")el.value=v;else el.setAttribute(k,v===true?"":v)}for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)))}return el}
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayISO(){return iso(new Date())}
function parse(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function fmtLong(s){const d=parse(s);return DAYS[d.getDay()]+", "+pad(d.getDate())+" "+MONTHS[d.getMonth()]+" "+d.getFullYear()}
function fmtShort(s){const d=parse(s);return pad(d.getDate())+" "+MON3[d.getMonth()]}
function fmtDay(s){const d=parse(s);return DAYS[d.getDay()].slice(0,3)+" "+pad(d.getDate())+" "+MON3[d.getMonth()]}
function fmtStamp(t){if(!t)return"";const d=new Date(t);if(isNaN(d))return"";return pad(d.getDate())+" "+MON3[d.getMonth()]+", "+pad(d.getHours())+":"+pad(d.getMinutes())}
function sum(o){let t=0;for(const v of Object.values(o||{}))t+=Number(v)||0;return t}
function addInto(a,b){for(const[k,v]of Object.entries(b||{}))a[k]=(a[k]||0)+(Number(v)||0);return a}
function slug(n){return (n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"staff").slice(0,40)}
function eid(date,key){return date+"__"+key}
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function newId(){return "n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}
function timeNow(){const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}
function swatch(i){return "var(--s"+((i%6)+1)+")"}
function listDates(a,b){const out=[];for(let d=a;d<=b&&out.length<400;d=addDays(d,1))out.push(d);return out}
function focusedIn(sel){const a=document.activeElement;return !!(a&&a.closest&&a.closest(sel)&&/TEXTAREA|INPUT|SELECT/.test(a.tagName)&&a.type!=="date")}

function normConfig(c){c=c||{};return{channels:Array.isArray(c.channels)&&c.channels.length?c.channels.slice():CH_DEFAULT.slice(),

  roster:Array.isArray(c.roster)?c.roster.filter(r=>r&&r.key&&r.name).map(r=>({key:r.key,name:r.name,email:r.email||"",role:ROLES[r.role]?r.role:"staff"})):[]}}
function rosterBy(k){return S.config.roster.find(r=>r.key===k)}
function nameOf(k){return rosterBy(k)?.name||S.memberNames?.[k]||k}
function staffKeys(){return S.config.roster.filter(r=>r.role==="staff").map(r=>r.key)}
function claimedBy(key){const r=rosterBy(key);return r&&r.email?r.email:null}
function keyOfUid(u){return u||null}
function myKey(){return S.meKey||null}
function realRole(){if(!S.live)return "manager";const k=myKey();return (k&&rosterBy(k)?.role)||null}
function myRole(){const r=realRole();if(r==="manager"&&S.viewAs)return S.viewAs;return r}
function entryTotal(e){if(!e)return 0;return sum(e.channels)||sum(e.topics)||Number(e.total)||0}
function entryNotes(e){if(!e)return[];if(Array.isArray(e.notes))return e.notes;if(e.remarks&&String(e.remarks).trim())return[{id:"legacy",topic:"",text:String(e.remarks).trim()}];return[]}
function teamNotes(sm){if(!sm)return[];if(Array.isArray(sm.notes))return sm.notes;const out=[];
  for(const[t,v]of Object.entries(sm.issues||{}))if(v&&String(v).trim())out.push({id:"i-"+slug(t),topic:t,text:String(v).trim()});
  String(sm.extra||"").split("\n").map(s=>s.replace(/^-\s*/,"").trim()).filter(Boolean).forEach((s,i)=>out.push({id:"x"+i,topic:"",text:s}));return out}

function indexEntries(){const by={};for(const e of Object.values(S.entries)){if(!e||!e.date)continue;(by[e.date]=by[e.date]||[]).push(e)}S.byDate=by}
function dayAgg(date,staff){
  if(staff){const e=S.entries[eid(date,staff)];const t=entryTotal(e);return{date,byStaff:t?{[staff]:t}:{},ch:clone(e?.channels||{}),tp:clone(e?.topics||{}),total:t,entries:e?[e]:[],summary:null,imported:false}}
  const es=S.byDate[date]||[];const byStaff={};const ch={},tp={};
  for(const e of es){byStaff[e.staff]=entryTotal(e);addInto(ch,e.channels);addInto(tp,e.topics)}
  const sm=S.summaries[date];let imported=false;
  if(sm&&sm.imported){if(!sum(ch)&&sm.imported.channels){addInto(ch,sm.imported.channels);imported=true}if(!sum(tp)&&sm.imported.topics){addInto(tp,sm.imported.topics);imported=true}}
  const total=sum(byStaff)||sum(ch)||sum(tp);
  return{date,byStaff,ch,tp,total,entries:es,summary:sm,imported}}

const CFG=window.DMT_CONFIG||{};
const CONFIGURED=!!(CFG.supabaseUrl&&CFG.supabaseAnonKey&&!/YOUR-PROJECT|YOUR-ANON/.test(CFG.supabaseUrl+CFG.supabaseAnonKey)&&window.supabase);
let sb=null;

async function boot(){
  $("#today").textContent=fmtLong(todayISO());
  setPreset(S.range);
  if(!CONFIGURED)return localMode();
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT")location.reload()});

  S.meName=session.user.user_metadata?.full_name||session.user.user_metadata?.name||"";
  try{await DB.loadAll()}catch(e){console.error(e);return renderProblem("Couldn’t load the tracker data. Check your connection and reload. If it keeps happening, ask your manager to check the database setup.",e)}
  const me=S.allMembers.find(m=>m.active&&(m.email||"").toLowerCase()===S.meEmail);

const DB={
  async loadAll(){
    const since=addDays(todayISO(),-400);
    const [tm,st,en,su,ca]=await Promise.all([
      sb.from("team_members").select("*").order("sort",{ascending:true}),
      sb.from("settings").select("*").eq("id",1).maybeSingle(),
      sb.from("entries").select("*").gte("date",since).limit(10000),
      sb.from("summaries").select("*").gte("date",since).limit(1000),
      sb.from("campaigns").select("*").limit(1000)]);
    for(const r of [tm,st,en,su,ca])if(r.error)throw r.error;
    S.allMembers=tm.data||[];
    S.memberNames={};S.allMembers.forEach(m=>S.memberNames[m.key]=m.name);
    S.config=normConfig({topics:st.data?.topics,channels:st.data?.channels,roster:S.allMembers.filter(m=>m.active)});
    const E={};(en.data||[]).forEach(r=>{E[r.id]={date:r.date,staff:r.staff,channels:r.channels||{},topics:r.topics||{},notes:r.notes||[],total:r.total||0,updatedBy:r.updated_by||"",updatedAt:r.updated_at}});
    S.entries=E;indexEntries();
    const SM={};(su.data||[]).forEach(r=>{SM[r.date]={date:r.date,notes:r.notes||[],imported:r.imported||undefined,updatedBy:r.updated_by||"",updatedAt:r.updated_at}});
    S.summaries=SM;
    const C={};(ca.data||[]).forEach(r=>{C[r.id]=Object.assign({},r.data||{},{updatedAt:r.updated_at,updatedBy:r.updated_by||""})});
    S.campaigns=C;
  },
  async saveEntry(id,doc){
    const {error}=await sb.from("entries").upsert({id,date:doc.date,staff:doc.staff,channels:doc.channels,topics:doc.topics,notes:doc.notes,total:doc.total,updated_by:S.meKey,updated_at:doc.updatedAt});
    if(error)throw error;
  },
  async saveSummary(doc){
    const row={date:doc.date,notes:doc.notes||[],updated_by:S.meKey,updated_at:doc.updatedAt};
    if(doc.imported)row.imported=doc.imported;
    const {error}=await sb.from("summaries").upsert(row);if(error)throw error;
  },
  async saveCampaign(id,doc){
    const data=Object.assign({},doc);delete data.updatedAt;delete data.updatedBy;
    const {error}=await sb.from("campaigns").upsert({id,data,updated_by:S.meKey,updated_at:doc.updatedAt});if(error)throw error;
  },
  async deleteCampaign(id){const {error}=await sb.from("campaigns").delete().eq("id",id);if(error)throw error},
  async saveConfig(cfg){
    const {error:e1}=await sb.from("settings").upsert({id:1,topics:cfg.topics,channels:cfg.channels,updated_at:new Date().toISOString()});if(e1)throw e1;
    const rows=cfg.roster.map((r,i)=>({key:r.key,name:r.name,role:r.role,email:(r.email||"").trim().toLowerCase()||null,sort:i,active:true}));
    if(rows.length){const {error:e2}=await sb.from("team_members").upsert(rows);if(e2)throw e2}
    const keep=new Set(rows.map(r=>r.key));
    const gone=S.allMembers.filter(m=>m.active&&!keep.has(m.key)).map(m=>m.key);
    if(gone.length){const {error:e3}=await sb.from("team_members").update({active:false}).in("key",gone);if(e3)throw e3}
  }
};

/* memo files in Supabase Storage (bucket "memos") */
const STORAGE={
  async upload(file,{type}){
    const safe=file.name.replace(/[^A-Za-z0-9._-]+/g,"_").slice(-80);
    const path="campaigns/"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)+"/"+safe;
    const {error}=await sb.storage.from("memos").upload(path,file,{contentType:type,upsert:false});
    if(error)throw Object.assign(new Error(error.message),{code:/size|large/i.test(error.message)?"too_large":"upstream_error"});
    return{id:path,contentType:type,sizeBytes:file.size};
  },
  async delete(path){const {error}=await sb.storage.from("memos").remove([path]);if(error)throw error;return{deleted:true}}
};
async function memoUrl(m,download){
  if(!sb)return null;
  const {data,error}=await sb.storage.from("memos").createSignedUrl(m.id,3600,download?{download:m.name}:undefined);
  if(error)throw error;return data.signedUrl;
}

function renderAll(){

function onData(){
  if(!S.ready)return;
  const role=myRole();
  if(!role||!tabsFor(role).some(t=>t[0]===S.tab))return renderAll();

/* ---------- ISSUE NOTES component ---------- */
/* opts: scope, notes, canEdit, onSave(note) -> Promise, onDelete(id) -> Promise, rerender(), empty, extra(note), showMeta */
function noteList(o){
  const wrap=h("div",{class:"notes"});
  const ed=S.noteEdit&&S.noteEdit.scope===o.scope?S.noteEdit:null;
  o.notes.forEach(n=>{wrap.append(ed&&ed.id===n.id?noteEditor(o,ed):noteItem(o,n))});
  if(ed&&ed.id==="new")wrap.append(noteEditor(o,ed));
  if(!o.notes.length&&!(ed&&ed.id==="new"))wrap.append(h("div",{class:"muted",style:"font-size:13px;padding:6px 0 2px",text:o.empty}));
  if(o.canEdit&&!(ed&&ed.id==="new"))wrap.append(h("div",{style:"margin-top:10px"},h("button",{class:"btn small",onclick:()=>{S.noteEdit={scope:o.scope,id:"new",topic:o.defaultTopic||"",text:""};S.noteDel=null;o.rerender();focusEditor()}},"+ Add issue note")));
  return wrap;
}
function topicSelect(id,value){
  const opts=[h("option",{value:""},"General (no topic)")];
  const list=S.config.topics.slice();if(value&&!list.includes(value))list.push(value);
  list.forEach(t=>{const op=h("option",{value:t},t);if(t===value)op.selected=true;opts.push(op)});
  const sel=h("select",{id},opts);if(!value)sel.value="";return sel;
}
function noteEditor(o,ed){
  const sid="ne-topic-"+slug(o.scope)+"-"+ed.id, tid="ne-text-"+slug(o.scope)+"-"+ed.id;
  const sel=topicSelect(sid,ed.topic);sel.addEventListener("change",()=>ed.topic=sel.value);
  const ta=h("textarea",{id:tid,rows:"3",class:"ne-text",placeholder:"What happened and what was done, e.g. Followed up RI incentive payment for 4 dealers; pending finance confirmation."});ta.value=ed.text;
  ta.addEventListener("input",()=>ed.text=ta.value);
  const save=async()=>{const text=ta.value.trim();if(!text){ta.focus();return toast("Write the note before saving")}
    const note={id:ed.id==="new"?newId():ed.id,topic:sel.value,text};
    S.noteEdit=null;try{await o.onSave(note)}catch(e){toast("Couldn’t save the note. Try again.");S.noteEdit=Object.assign(ed,{text,topic:sel.value})}o.rerender()};
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();save()}if(e.key==="Escape"){S.noteEdit=null;o.rerender()}});
  return h("div",{class:"nedit"},
    h("div",{class:"field"},h("label",{class:"label",for:sid},"Topic"),sel),
    h("div",{class:"field"},h("label",{class:"label",for:tid},ed.id==="new"?"New issue note":"Edit issue note"),ta),
    h("div",{class:"acts"},h("button",{class:"btn primary small",onclick:save},ed.id==="new"?"Add note":"Save changes"),
      h("button",{class:"btn small",onclick:()=>{S.noteEdit=null;o.rerender()}},"Cancel")));
}
function noteItem(o,n){
  const delKey=o.scope+"|"+n.id;const confirming=S.noteDel===delKey;
  const acts=[];
  if(o.extra){const x=o.extra(n);if(x)acts.push(x)}
  if(o.canEdit){
    if(confirming)acts.push(h("button",{class:"btn small danger",onclick:async()=>{S.noteDel=null;try{await o.onDelete(n.id);toast("Note deleted")}catch(e){toast("Couldn’t delete. Try again.")}o.rerender()}},"Delete"),
      h("button",{class:"btn small",onclick:()=>{S.noteDel=null;o.rerender()}},"Keep"));
    else acts.push(h("button",{class:"btn small",onclick:()=>{S.noteEdit={scope:o.scope,id:n.id,topic:n.topic||"",text:n.text||""};S.noteDel=null;o.rerender();focusEditor()}},"Edit"),
      h("button",{class:"btn small",onclick:()=>{S.noteDel=delKey;o.rerender()}},"Delete…"));
  }
  const meta=[];if(o.showMeta&&n.byName)meta.push(n.byName);if(n.at)meta.push((n.edited?"edited ":"")+fmtStamp(n.at));
  return h("div",{class:"nitem"},
    h("span",{class:n.topic?"pill":"pill plain",text:n.topic||"General"}),
    h("div",{class:"tx",text:n.text}),
    acts.length?h("div",{class:"acts"},acts):null,
    meta.length?h("div",{class:"meta",text:meta.join(" · ")}):null);
}
function focusEditor(){setTimeout(()=>{const t=document.querySelector(".nedit textarea");if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length)}},0)}
function upsert(list,note){const out=list.map(x=>Object.assign({},x));const i=out.findIndex(x=>x.id===note.id);
  const stamp={at:new Date().toISOString(),by:S.meKey||""};
  if(i>=0)out[i]=Object.assign(out[i],{topic:note.topic,text:note.text,edited:true},stamp);else out.push(Object.assign({id:note.id,topic:note.topic,text:note.text},stamp));return out}

async function uploadMemos(files){

    if(!type){toast(f.name+": upload memos as PDF or image");continue}

    if(st)st.textContent="Uploading "+f.name+"…";
    try{const r=await S.assets.upload(f,{type});
      const m={id:r.id,name:f.name,type:r.contentType||type,size:r.sizeBytes||f.size,at:new Date().toISOString(),by:S.meKey||""};
      if(S.campEdit!==E){try{await S.assets.delete(r.id)}catch(e){}return}
